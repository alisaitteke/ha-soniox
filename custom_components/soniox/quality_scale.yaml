rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No service actions are registered yet.
  appropriate-polling:
    status: exempt
    comment: Request/response cloud STT/TTS; there is no polling interval.
  brands:
    status: done
    comment: Local brand images in custom_components/soniox/brand/ (HA 2026.3+).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No service actions are registered yet.
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: STT/TTS are on-demand; there are no device event subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions are registered yet.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
  docs-installation-parameters:
    status: todo
  entity-unavailable:
    status: exempt
    comment: Cloud STT/TTS entities stay available; request errors are returned per call.
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: >-
      Cloud STT/TTS entities stay available; a failed request is logged with
      its Soniox error_type and request_id and reported to the caller.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      pytest runs in CI with coverage. The suite imports the real soniox SDK
      rather than stubs, so pydantic validation is genuinely exercised.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud API service; there is no discoverable device.
  discovery-update-info:
    status: exempt
    comment: Cloud API service; there is no network discovery info.
  docs-data-update:
    status: exempt
    comment: No polled device state; STT/TTS are on-demand.
  docs-examples:
    status: todo
  docs-known-limitations:
    status: done
    comment: README documents endpoint detection vs diarization and Python 3.13.6.
  docs-supported-devices:
    status: exempt
    comment: This integration does not support physical devices.
  docs-supported-functions:
    status: todo
  docs-troubleshooting:
    status: done
    comment: README explains permission, quota and region problems.
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: exempt
    comment: Cloud API service; there are no dynamic devices.
  entity-category:
    status: todo
  entity-device-class:
    status: exempt
    comment: There is no device class for STT/TTS entities.
  entity-disabled-by-default:
    status: todo
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Cloud API service; there are no physical devices to expire.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: >
      The official soniox SDK constructs its own httpx.AsyncClient and does
      not accept an injected Home Assistant websession.
  strict-typing: done
