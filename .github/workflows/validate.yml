name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  version:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check manifest and pyproject versions
        run: python3 scripts/check_version.py

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.9" "mypy>=1.13" "homeassistant>=2025.6.0" "soniox==2.10.0"

      - name: Ruff check
        run: ruff check .

      - name: Mypy
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned on purpose. A floating pin once resolved to a Home Assistant
      # that pins Pydantic v1, which silently forced the suite to run against
      # local SDK stubs instead of the real soniox package.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre "pytest-homeassistant-custom-component==0.13.250" \
            "soniox==2.10.0" "pytest-asyncio>=0.24" "pytest-cov>=5.0" \
            "mutagen==1.47.0" "ha-ffmpeg==3.2.2"

      - name: Verify the real Soniox SDK is importable
        run: python -c "import soniox.errors, soniox.types; print('soniox SDK OK')"

      - name: Pytest
        run: pytest --cov=custom_components/soniox --cov-report=term-missing

      - name: Check manifest and pyproject versions
        run: python3 scripts/check_version.py
