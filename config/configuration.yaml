# Local Home Assistant used by scripts/develop.
# https://www.home-assistant.io/integrations/default_config/
default_config:

# https://www.home-assistant.io/integrations/homeassistant/
homeassistant:
  debug: true

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    # debug shows the model, voice, language and endpoint settings used for
    # every STT/TTS request. Set to info to only see failures and setup events.
    custom_components.soniox: debug
    # The SDK itself does not log; this only surfaces httpx/websockets frames.
    soniox: debug
    httpx: warning
    httpcore: warning
